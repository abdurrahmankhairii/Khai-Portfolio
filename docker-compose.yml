
services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3005:3000"
    volumes:
      - ./public:/app/public
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
